<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline – Mobile Lab Mityana</title>
<meta name="theme-color" content="#0ea5e9">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito',Arial,sans-serif;
  background:linear-gradient(135deg,#0ea5e9,#14b8a6,#10b981);
  background-size:300% 300%;
  animation:gradShift 8s ease infinite;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
@keyframes gradShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.card{
  background:#fff;
  border-radius:28px;
  padding:40px 28px;
  max-width:400px;
  width:100%;
  text-align:center;
  box-shadow:0 24px 60px rgba(2,6,23,0.2);
  animation:cardIn 0.5s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.icon{font-size:72px;margin-bottom:20px;animation:bounce 2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
h1{font-size:24px;font-weight:900;color:#0f172a;margin-bottom:10px;}
p{font-size:14px;color:#64748b;font-weight:600;margin-bottom:28px;line-height:1.6;}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-family:'Nunito',Arial,sans-serif;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  transition:all 0.2s;
  margin-bottom:10px;
}
.btn-primary{
  background:linear-gradient(135deg,#0ea5e9,#14b8a6);
  color:#fff;
  box-shadow:0 8px 24px rgba(14,165,233,0.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(14,165,233,0.45);}
.btn-secondary{
  background:#f1f5f9;
  color:#0f172a;
  border:1.5px solid rgba(0,0,0,0.08);
}
.btn-secondary:hover{background:#e2e8f0;}
.retry-status{
  font-size:12px;
  font-weight:700;
  color:#94a3b8;
  margin-top:12px;
}
.dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:#ef4444;
  margin-right:6px;
  animation:blink 1.5s infinite;
}
.dot.online{background:#22c55e;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>No internet connection detected.<br>Some pages are still available from cache — try Dashboard or Login.</p>

  <a class="btn btn-primary" href="dashboard.html">🏠 Go to Dashboard</a>
  <a class="btn btn-secondary" href="login.html">🔐 Login Page</a>
  <button class="btn btn-secondary" onclick="retryConnection()" id="retryBtn">🔄 Retry Connection</button>

  <div class="retry-status" id="statusLine">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Offline</span>
  </div>
</div>

<script>
function updateStatus(){
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(navigator.onLine){
    dot.className = "dot online";
    text.innerText = "Back online! Redirecting...";
    setTimeout(()=>{ window.location.href = "dashboard.html"; }, 1500);
  } else {
    dot.className = "dot";
    text.innerText = "Still offline";
  }
}

function retryConnection(){
  const btn = document.getElementById("retryBtn");
  btn.innerText = "⏳ Checking...";
  btn.disabled = true;
  setTimeout(()=>{
    updateStatus();
    btn.innerText = "🔄 Retry Connection";
    btn.disabled = false;
  }, 1000);
}

window.addEventListener("online", updateStatus);
window.addEventListener("offline", updateStatus);
updateStatus();
</script>
</body>
</html>
