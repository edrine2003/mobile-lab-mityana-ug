<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Articles – Mobile Lab Mityana</title>
<meta name="theme-color" content="#0ea5e9">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--primary:#0ea5e9;--primary2:#14b8a6;--dark:#0f172a;--muted:#64748b;--border:rgba(0,0,0,0.08);--bg:#f1f5f9;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',Arial,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;padding-bottom:60px;}

.topbar{background:linear-gradient(135deg,#0ea5e9,#14b8a6);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.15);}
.topbar h2{color:#fff;font-size:18px;font-weight:900;flex:1;}
.topbar-btn{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',Arial,sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s;}
.topbar-btn:hover{background:rgba(255,255,255,0.3);}

.hero{background:linear-gradient(135deg,#0ea5e9,#14b8a6,#10b981);padding:28px 20px 32px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-80px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,0.08);pointer-events:none;}
.hero h1{color:#fff;font-size:26px;font-weight:900;margin-bottom:6px;}
.hero p{color:rgba(255,255,255,0.9);font-size:14px;font-weight:600;}

.search-wrap{max-width:700px;margin:18px auto 0;padding:0 16px;}
.search-box{width:100%;padding:13px 18px;border-radius:16px;border:2px solid var(--border);font-family:'Nunito',Arial,sans-serif;font-size:14px;font-weight:600;outline:none;box-shadow:0 4px 16px rgba(0,0,0,0.07);}
.search-box:focus{border-color:var(--primary);}

.tabs-wrap{max-width:900px;margin:16px auto 0;padding:0 16px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:#fff;color:var(--muted);font-family:'Nunito',Arial,sans-serif;transition:all 0.2s;}
.tab.active,.tab:hover{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(14,165,233,0.3);}

.results-info{max-width:900px;margin:12px auto 0;padding:0 16px;font-size:13px;font-weight:700;color:var(--muted);}

.grid{max-width:900px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}

/* ARTICLE CARD */
.article-card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.07);border:1px solid var(--border);transition:all 0.2s;animation:fadeUp 0.4s ease both;cursor:pointer;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.article-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.11);}
.card-banner{height:140px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden;}
.card-banner img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}
.card-banner .banner-emoji{position:relative;z-index:1;font-size:52px;text-shadow:0 2px 8px rgba(0,0,0,0.2);}
.card-cat{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,0.9);backdrop-filter:blur(4px);z-index:2;}
.card-read{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(0,0,0,0.25);color:#fff;z-index:2;}
.card-body{padding:16px;}
.card-title{font-size:15px;font-weight:900;color:var(--dark);margin-bottom:6px;line-height:1.4;}
.card-desc{font-size:13px;font-weight:600;color:var(--muted);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.read-btn{padding:9px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',Arial,sans-serif;transition:all 0.2s;}
.read-btn:hover{transform:translateY(-1px);}
.card-date{font-size:11px;font-weight:700;color:var(--muted);}

/* SKELETON LOADER */
.skeleton{background:#e2e8f0;border-radius:12px;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{opacity:1;}50%{opacity:0.5;}100%{opacity:1;}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:#e2e8f0;border-radius:999px;margin:14px auto 0;}
.modal-banner{height:200px;display:flex;align-items:center;justify-content:center;font-size:72px;margin:10px 20px 0;border-radius:20px;overflow:hidden;position:relative;}
.modal-banner img{width:100%;height:100%;object-fit:cover;}
.modal-banner .modal-emoji{position:absolute;font-size:72px;}
.modal-content{padding:20px 22px 40px;}
.modal-cat{display:inline-block;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px;}
.modal-title{font-size:22px;font-weight:900;color:var(--dark);margin-bottom:8px;line-height:1.3;}
.modal-meta{display:flex;gap:16px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:16px;flex-wrap:wrap;}
.modal-body{font-size:14px;font-weight:600;color:#334155;line-height:1.8;white-space:pre-wrap;}
.modal-body h3{font-size:15px;font-weight:900;color:var(--dark);margin:18px 0 8px;}
.modal-body p{margin-bottom:14px;}
.modal-body ul{padding-left:20px;margin-bottom:14px;}
.modal-body li{margin-bottom:6px;}
.book-btn{display:block;width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15px;font-weight:900;cursor:pointer;font-family:'Nunito',Arial,sans-serif;box-shadow:0 6px 18px rgba(14,165,233,0.3);margin-top:20px;text-align:center;text-decoration:none;}
.close-btn{display:block;width:100%;padding:12px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--muted);font-size:14px;font-weight:800;cursor:pointer;font-family:'Nunito',Arial,sans-serif;margin-top:10px;}

/* EMPTY STATE */
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-weight:700;grid-column:1/-1;}
.empty .empty-icon{font-size:48px;margin-bottom:12px;}
</style>
</head>
<body>

<div class="topbar">
  <span style="font-size:22px;">📰</span>
  <h2>Health Articles</h2>
  <a class="topbar-btn" href="dashboard.html">🏠 Home</a>
</div>

<div class="hero">
  <h1>📰 Health Articles</h1>
  <p>Stay informed. Stay healthy. Knowledge from Mobile Lab Mityana.</p>
</div>

<div class="search-wrap">
  <input class="search-box" id="searchBox" placeholder="🔍 Search articles e.g. malaria, HIV, diabetes..." oninput="filterArticles()">
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabsRow">
    <button class="tab active" onclick="filterByTab(this,'all')">All</button>
    <button class="tab" onclick="filterByTab(this,'blood')">🩸 Blood Health</button>
    <button class="tab" onclick="filterByTab(this,'womens')">🌸 Women's Health</button>
    <button class="tab" onclick="filterByTab(this,'infections')">🦠 Infections</button>
    <button class="tab" onclick="filterByTab(this,'nutrition')">🥗 Nutrition</button>
    <button class="tab" onclick="filterByTab(this,'mental')">🧠 Mental Health</button>
    <button class="tab" onclick="filterByTab(this,'general')">📋 General</button>
  </div>
</div>

<div class="results-info" id="resultsInfo">Loading articles...</div>
<div class="grid" id="articlesGrid">
  <!-- skeleton placeholders -->
  <div style="border-radius:22px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.07);">
    <div class="skeleton" style="height:140px;"></div>
    <div style="padding:16px;"><div class="skeleton" style="height:18px;margin-bottom:10px;"></div><div class="skeleton" style="height:13px;margin-bottom:6px;"></div><div class="skeleton" style="height:13px;width:70%;"></div></div>
  </div>
  <div style="border-radius:22px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.07);">
    <div class="skeleton" style="height:140px;"></div>
    <div style="padding:16px;"><div class="skeleton" style="height:18px;margin-bottom:10px;"></div><div class="skeleton" style="height:13px;margin-bottom:6px;"></div><div class="skeleton" style="height:13px;width:70%;"></div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="articleModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-banner" id="modalBanner"><span class="modal-emoji" id="modalEmoji">📰</span></div>
    <div class="modal-content">
      <div class="modal-cat" id="modalCat"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-body" id="modalBody"></div>
      <a class="book-btn" href="index.html">🧪 Book Related Test</a>
      <button class="close-btn" onclick="closeModal()">✕ Close</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA4II_I1weZZGzP990t9UWJCXjuK932pdY",
  authDomain: "mobile-lab-mityana-aeae2.firebaseapp.com",
  projectId: "mobile-lab-mityana-aeae2",
  storageBucket: "mobile-lab-mityana-aeae2.firebasestorage.app",
  messagingSenderId: "624002906588",
  appId: "1:624002906588:web:08b4259f90ffa9adad7719"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Category display config
const CAT_CONFIG = {
  blood:      { label:"🩸 Blood Health",    color:"rgba(239,68,68,0.12)",    text:"#b91c1c" },
  womens:     { label:"🌸 Women's Health",  color:"rgba(236,72,153,0.12)",   text:"#be185d" },
  infections: { label:"🦠 Infections",      color:"rgba(139,92,246,0.12)",   text:"#7c3aed" },
  nutrition:  { label:"🥗 Nutrition",       color:"rgba(34,197,94,0.12)",    text:"#15803d" },
  mental:     { label:"🧠 Mental Health",   color:"rgba(59,130,246,0.12)",   text:"#1d4ed8" },
  general:    { label:"📋 General",         color:"rgba(14,165,233,0.12)",   text:"#0369a1" }
};

// Default gradient backgrounds per category
const CAT_GRADIENTS = {
  blood:      "linear-gradient(135deg,#fecaca,#fee2e2)",
  womens:     "linear-gradient(135deg,#fce7f3,#fbcfe8)",
  infections: "linear-gradient(135deg,#ede9fe,#ddd6fe)",
  nutrition:  "linear-gradient(135deg,#d1fae5,#a7f3d0)",
  mental:     "linear-gradient(135deg,#dbeafe,#bfdbfe)",
  general:    "linear-gradient(135deg,#e0f2fe,#bae6fd)"
};

let allArticles = [];
let activeTab   = "all";
let searchTerm  = "";

// ── LOAD FROM FIRESTORE ──
async function loadArticles() {
  try {
    const snap = await db.collection("articles")
      .orderBy("createdAt", "desc")
      .get();

    allArticles = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderArticles();
  } catch (e) {
    document.getElementById("articlesGrid").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load articles. Check your connection.</p></div>`;
    document.getElementById("resultsInfo").innerText = "";
  }
}

// ── RENDER ──
function renderArticles() {
  const grid = document.getElementById("articlesGrid");
  grid.innerHTML = "";
  let shown = 0;

  const filtered = allArticles.filter(a => {
    const matchTab    = activeTab === "all" || a.category === activeTab;
    const haystack    = (a.title + " " + a.summary + " " + a.body).toLowerCase();
    const matchSearch = !searchTerm || haystack.includes(searchTerm);
    return matchTab && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">😕</div><p>No articles found for "<b>${searchTerm || activeTab}</b>"</p></div>`;
    document.getElementById("resultsInfo").innerText = "No results";
    return;
  }

  filtered.forEach((a, i) => {
    shown++;
    const cfg      = CAT_CONFIG[a.category] || CAT_CONFIG.general;
    const gradient = CAT_GRADIENTS[a.category] || CAT_GRADIENTS.general;
    const dateStr  = a.createdAt ? a.createdAt.toDate().toLocaleDateString("en-UG",{day:"numeric",month:"short",year:"numeric"}) : "";

    const card = document.createElement("div");
    card.className = "article-card";
    card.style.animationDelay = (i * 0.05) + "s";

    // Banner: use uploaded image if available, else gradient + emoji
    const bannerHTML = a.imageURL
      ? `<img src="${a.imageURL}" alt="${a.title}" loading="lazy">
         <span class="card-cat" style="color:${cfg.text};">${cfg.label}</span>
         <span class="card-read">⏱ ${a.readTime || "3 min read"}</span>`
      : `<span class="banner-emoji">${a.icon || "📰"}</span>
         <span class="card-cat" style="color:${cfg.text};">${cfg.label}</span>
         <span class="card-read">⏱ ${a.readTime || "3 min read"}</span>`;

    card.innerHTML = `
      <div class="card-banner" style="${a.imageURL ? "" : "background:"+gradient}">
        ${bannerHTML}
      </div>
      <div class="card-body">
        <div class="card-title">${a.title}</div>
        <div class="card-desc">${a.summary || ""}</div>
        <div class="card-footer">
          <button class="read-btn" onclick="event.stopPropagation();openArticle('${a.id}')">📖 Read More</button>
          <span class="card-date">${dateStr}</span>
        </div>
      </div>`;

    card.onclick = () => openArticle(a.id);
    grid.appendChild(card);
  });

  document.getElementById("resultsInfo").innerText =
    `Showing ${shown} of ${allArticles.length} article${allArticles.length !== 1 ? "s" : ""}`;
}

// ── OPEN MODAL ──
function openArticle(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;

  const cfg      = CAT_CONFIG[a.category] || CAT_CONFIG.general;
  const gradient = CAT_GRADIENTS[a.category] || CAT_GRADIENTS.general;
  const dateStr  = a.createdAt ? a.createdAt.toDate().toLocaleDateString("en-UG",{day:"numeric",month:"short",year:"numeric"}) : "";

  const banner = document.getElementById("modalBanner");
  const emoji  = document.getElementById("modalEmoji");
  if (a.imageURL) {
    banner.style.background = "none";
    banner.innerHTML = `<img src="${a.imageURL}" alt="${a.title}" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">`;
  } else {
    banner.style.background = gradient;
    banner.innerHTML = `<span class="modal-emoji">${a.icon || "📰"}</span>`;
  }

  document.getElementById("modalCat").innerText        = cfg.label;
  document.getElementById("modalCat").style.background = cfg.color;
  document.getElementById("modalCat").style.color      = cfg.text;
  document.getElementById("modalTitle").innerText      = a.title;
  document.getElementById("modalMeta").innerHTML       =
    `<span>⏱ ${a.readTime || "3 min read"}</span><span>📅 ${dateStr}</span>${a.author ? `<span>✍️ ${a.author}</span>` : ""}`;
  document.getElementById("modalBody").innerHTML       = a.body || "";

  document.getElementById("articleModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("articleModal").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("articleModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

function filterByTab(btn, tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeTab = tab;
  renderArticles();
}

function filterArticles() {
  searchTerm = document.getElementById("searchBox").value.toLowerCase().trim();
  renderArticles();
}

// ── START ──
loadArticles();
</script>
</body>
</html>
